name: ROM diff unit tests

on:
  pull_request:
    paths:
      - "src/zelda_suite/diff/**"
      - "tests/test_rom_diff.py"
      - "docs/rom-diff.md"
      - ".github/workflows/rom-diff-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/zelda_suite/diff/**"
      - "tests/test_rom_diff.py"
      - "docs/rom-diff.md"
      - ".github/workflows/rom-diff-tests.yml"

permissions:
  contents: read

jobs:
  rom-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and lint tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint diff implementation and tests
        run: python -m ruff check --isolated src/zelda_suite/diff tests/test_rom_diff.py
      - name: Run synthetic diff tests
        run: PYTHONPATH=src python -m pytest -c /dev/null -q tests/test_rom_diff.py
