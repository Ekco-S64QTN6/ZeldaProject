name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned disassembly
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Lint changed Python components
        run: >-
          python -m ruff check
          src/zelda_suite/cli/main.py
          src/zelda_suite/extract
          tests/test_asset_loader.py
          tests/test_disassembly.py
          tests/test_incbin_inventory.py
          tests/test_incbin_cli.py
          tests/test_pointer_table_cli.py
          tests/test_pinned_disassembly.py
          tests/test_pinned_incbin_inventory.py
          tests/test_source_export_integration.py
          tests/test_rom_image.py
          tests/test_rom_file_diff_cli.py
          tests/test_data_table.py
          tests/test_data_table_cli.py
          tests/test_pinned_data_table.py
          tests/test_extracted_table_assets.py
          tests/test_extracted_falling_prize_layout.py
          tests/test_extracted_text_dictionary.py
          tests/test_dictionary_inventory.py
          tests/test_text_message_index.py
          tests/test_sprite_dispatch.py
          tests/test_music_track_index.py
          tests/test_music_payload_inventory.py
      - name: Run tests
        run: python -m pytest -q
