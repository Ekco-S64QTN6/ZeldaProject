name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned disassembly
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Check POSIX setup script syntax
        run: bash -n scripts/setup.sh
      - name: Lint all Python source and tests
        run: python -m ruff check src tests
      - name: Check types
        run: python -m mypy src
      - name: Run tests
        run: python -m pytest -q

  setup-posix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Run POSIX workspace setup smoke test
        run: |
          workspace="$RUNNER_TEMP/zelda-setup-smoke"
          bash scripts/setup.sh --name ci-smoke --workspace "$workspace"
          test -f "$workspace/project/ci-smoke.db"
          test -f "$workspace/project/ci-smoke.json"
          uv run zelda-suite validate "$workspace/project/ci-smoke.db"

  setup-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PowerShell workspace setup smoke test
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "zelda-setup-smoke"
          .\scripts\setup.ps1 -Name "ci-smoke" -Workspace $workspace
          $database = Join-Path $workspace "project/ci-smoke.db"
          $jsonExport = Join-Path $workspace "project/ci-smoke.json"
          if (-not (Test-Path $database)) { throw "Setup did not create the SQLite project." }
          if (-not (Test-Path $jsonExport)) { throw "Setup did not create the JSON export." }
          Write-Host "PowerShell setup created and validated project files without a ROM."

  package-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheelhouse"
      - name: Install wheel in a clean environment and smoke-test CLI
        run: |
          venv="$RUNNER_TEMP/zelda-wheel-venv"
          workspace="$RUNNER_TEMP/zelda-wheel-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install "$RUNNER_TEMP"/wheelhouse/*.whl
          "$venv/bin/zelda-suite" --version
          "$venv/bin/zelda-suite" --help >/dev/null
          mkdir -p "$workspace"
          "$venv/bin/zelda-suite" init wheel-smoke --workspace "$workspace"
          "$venv/bin/zelda-suite" validate "$workspace/project/wheel-smoke.db"
