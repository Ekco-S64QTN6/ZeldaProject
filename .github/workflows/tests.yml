name: Python tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned disassembly
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Check POSIX setup script syntax
        run: bash -n scripts/setup.sh
      - name: Lint changed Python components
        run: >-
          python -m ruff check
          src/zelda_suite/cli/main.py
          src/zelda_suite/extract
          src/zelda_suite/project
          tests/test_asset_loader.py
          tests/test_project_store.py
          tests/test_project_assets.py
          tests/test_project_validation.py
          tests/test_disassembly.py
          tests/test_incbin_inventory.py
          tests/test_incbin_cli.py
          tests/test_pointer_table_cli.py
          tests/test_pinned_disassembly.py
          tests/test_pinned_incbin_inventory.py
          tests/test_source_export_integration.py
          tests/test_rom_image.py
          tests/test_rom_file_diff_cli.py
          tests/test_rom_diff.py
          tests/test_data_table.py
          tests/test_data_table_cli.py
          tests/test_doctor.py
          tests/test_pinned_data_table.py
          tests/test_extracted_table_assets.py
          tests/test_extracted_falling_prize_layout.py
          tests/test_extracted_text_dictionary.py
          tests/test_dictionary_inventory.py
          tests/test_text_message_index.py
          tests/test_sprite_dispatch.py
          tests/test_music_track_index.py
          tests/test_music_payload_inventory.py
          tests/test_extracted_dungeon_room_pointers.py
          tests/test_extracted_dungeon_room_payloads.py
          tests/test_extracted_overworld_hidden_items.py
          tests/test_overworld_payload_inventories.py
          tests/test_overworld_payload_pairs.py
          tests/test_item_receipt_tables.py
          tests/test_setup_script.py
      - name: Run tests
        run: python -m pytest -q

  setup-posix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Run POSIX workspace setup smoke test
        run: |
          workspace="$RUNNER_TEMP/zelda-setup-smoke"
          bash scripts/setup.sh --name ci-smoke --workspace "$workspace"
          test -f "$workspace/project/ci-smoke.db"
          test -f "$workspace/project/ci-smoke.json"
          uv run zelda-suite validate "$workspace/project/ci-smoke.db"

  setup-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PowerShell workspace setup smoke test
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "zelda-setup-smoke"
          .\scripts\setup.ps1 -Name "ci-smoke" -Workspace $workspace
          $database = Join-Path $workspace "project/ci-smoke.db"
          $jsonExport = Join-Path $workspace "project/ci-smoke.json"
          if (-not (Test-Path $database)) { throw "Setup did not create the SQLite project." }
          if (-not (Test-Path $jsonExport)) { throw "Setup did not create the JSON export." }
          Write-Host "PowerShell setup created and validated project files without a ROM."
